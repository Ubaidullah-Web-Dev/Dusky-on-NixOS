# ===================================================================
# 🎨 FOOT MATUGEN THEME 
# ===================================================================

[colors-dark]
# Cursor Colors (Format: <text-color> <cursor-color>)
cursor=bfc9c4 dee4e0

# Base UI Colors
alpha=0.99
blur=yes
foreground=dee4e0
background=0f1512
selection-foreground=1d352e
selection-background=b2ccc2
urls=86d6be

# ===================================================================
# 16-COLOR TERMINAL PALETTE
# ===================================================================
# Normal colors
regular0=4c4c4c  # black
regular1=ac8a8c  # red
regular2=8aac8b  # green
regular3=aca98a  # yellow
regular4=86d6be  # blue (Matugen dynamically injected)
regular5=ac8aac  # magenta
regular6=8aacab  # cyan
regular7=e7e7e7  # white

# Bright colors
bright0=bfc9c4   # bright black (Matugen dynamically injected)
bright1=c49ea0   # bright red
bright2=9ec49f   # bright green
bright3=c4c19e   # bright yellow
bright4=86d6be   # bright blue (Matugen dynamically injected)
bright5=c49ec4   # bright magenta
bright6=9ec3c4   # bright cyan
bright7=f0f0f0   # bright white
