# : Manager [[[

[mgr]
cwd = { fg = "#dee4e0" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#5fbdff", bg = "#5fbdff" }
marker_cut      = { fg = "#c5e7ff", bg = "#c5e7ff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a9cbe3", bg = "#a9cbe3" }

# Count
count_copied   = { fg = "#001e2d", bg = "#c5e7ff" }
count_cut      = { fg = "#001e2d", bg = "#c5e7ff" }
count_selected = { fg = "#00382c", bg = "#a9cbe3" }

# Border
border_symbol = "│"
border_style  = { fg = "#86d6be" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#86d6be", bold = true, bg = "#0f1512" }
inactive  = { fg = "#b2ccc2", bg = "#0f1512" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#86d6be", fg = "#00382c", bold = true }
normal_alt  = { bg = "#3f4945", fg = "#bfc9c4" }

# Select mode
select_main = { bg = "#b2ccc2", fg = "#1d352e", bold = true }
select_alt  = { bg = "#3f4945", fg = "#bfc9c4" }

# Unset mode
unset_main = { bg = "#a9cbe3", fg = "#0e3446", bold = true }
unset_alt  = { bg = "#3f4945", fg = "#bfc9c4" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#5b8a78" }
perm_write = { fg = "#3c84b7" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#2ca8ff" }
perm_sep   = { fg = "#1fdca1" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#86d6be", bg = "#343b38" }
progress_error  = { fg = "#ffb4ab", bg = "#343b38" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = {}
border = { fg = "#86d6be" }
cand = { fg = "#86d6be" }
rest = { fg = "#bfc9c4" }
desc = { fg = "#dee4e0" }
separator = " ▶ "
separator_style = { fg = "#dee4e0" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#a9cbe3" }
title_warn  = { fg = "#86d6be" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#86d6be" }
active = { fg = "#a9cbe3", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#86d6be" }
title = { fg = "#86d6be" }
value  = { fg = "#dee4e0" }
selected = { bg = "#005141", fg = "#a2f2d9" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#86d6be", bg = "#00382c" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#86d6be" }
title   = {}
hovered = { fg = "#c5e7ff", underline = true }

# : ]]]


# : Confirm [[[

[confirm]
border = { fg = "#86d6be" }
title  = { fg = "#86d6be" }

# : ]]]


# : Spot [[[

[spot]
border  = { fg = "#86d6be" }
title   = { fg = "#86d6be" }
tbl_col = { fg = "#86d6be" }

# : ]]]


# : Help [[[

[help]
border  = { fg = "#86d6be" }
chord   = { fg = "#86d6be" }
action  = {}
hovered = { reversed = true, bold = true }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dee4e0" },
    { url = "*/", fg = "#86d6be" },
]

# : ]]]
