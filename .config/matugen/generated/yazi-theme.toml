# : Manager [[[

[mgr]
cwd = { fg = "#d7e5e8" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#38deff", bg = "#38deff" }
marker_cut      = { fg = "#9eefff", bg = "#9eefff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#82d3e2", bg = "#82d3e2" }

# Count
count_copied   = { fg = "#001f24", bg = "#9eefff" }
count_cut      = { fg = "#001f24", bg = "#9eefff" }
count_selected = { fg = "#003921", bg = "#82d3e2" }

# Border
border_symbol = "│"
border_style  = { fg = "#74daa3" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#74daa3", bold = true, bg = "#091518" }
inactive  = { fg = "#91d5ac", bg = "#091518" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#74daa3", fg = "#003921", bold = true }
normal_alt  = { bg = "#334b4f", fg = "#b1cbd0" }

# Select mode
select_main = { bg = "#91d5ac", fg = "#003921", bold = true }
select_alt  = { bg = "#334b4f", fg = "#b1cbd0" }

# Unset mode
unset_main = { bg = "#82d3e2", fg = "#00363e", bold = true }
unset_alt  = { bg = "#334b4f", fg = "#b1cbd0" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#39945d" }
perm_write = { fg = "#2691a5" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#05d6ff" }
perm_sep   = { fg = "#10de6c" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#74daa3", bg = "#2f3b3e" }
progress_error  = { fg = "#ffb4ab", bg = "#2f3b3e" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = {}
border = { fg = "#74daa3" }
cand = { fg = "#74daa3" }
rest = { fg = "#b1cbd0" }
desc = { fg = "#d7e5e8" }
separator = " ▶ "
separator_style = { fg = "#d7e5e8" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#82d3e2" }
title_warn  = { fg = "#74daa3" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#74daa3" }
active = { fg = "#82d3e2", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#74daa3" }
title = { fg = "#74daa3" }
value  = { fg = "#d7e5e8" }
selected = { bg = "#005232", fg = "#90f7be" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#74daa3", bg = "#003921" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#74daa3" }
title   = {}
hovered = { fg = "#9eefff", underline = true }

# : ]]]


# : Confirm [[[

[confirm]
border = { fg = "#74daa3" }
title  = { fg = "#74daa3" }

# : ]]]


# : Spot [[[

[spot]
border  = { fg = "#74daa3" }
title   = { fg = "#74daa3" }
tbl_col = { fg = "#74daa3" }

# : ]]]


# : Help [[[

[help]
border  = { fg = "#74daa3" }
chord   = { fg = "#74daa3" }
action  = {}
hovered = { reversed = true, bold = true }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#d7e5e8" },
    { url = "*/", fg = "#74daa3" },
]

# : ]]]
